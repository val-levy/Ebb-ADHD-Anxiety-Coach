name: Ebb
options:
  bundleIdPrefix: app.ebb
  deploymentTarget: { iOS: "17.0" }
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Ebb:
    type: application
    platform: iOS
    sources: [Ebb]
    dependencies:
      - package: Supabase
    info:
      path: Ebb/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts: [Grandstander-SemiBold.ttf, Grandstander-Bold.ttf, Grandstander-ExtraBold.ttf, Grandstander-Black.ttf]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
